# main 에 data.json 등이 올라오면 build.py 로 페이지를 만들어 GitHub Pages 에 게시한다.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - name: 웹 문서 틀 씌우기
        run: |
          mkdir -p _site
          { printf '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">\n'; cat index.html; printf '\n</html>\n'; } > _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # 업로드 직후엔 GitHub 쪽에서 파일이 아직 안 보일 때가 있어 잠깐 기다렸다가 배포하고, 실패하면 한 번 더 한다
      - run: sleep 20
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
